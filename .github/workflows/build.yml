name: Build Carrom Aim APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare and Unpack Project
      run: |
        unzip -q aim-master-pro.zip -d extracted || true
        if [ -d "extracted" ]; then
          find extracted -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1 | xargs -I {} cp -r {}/. .
        fi
        chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Carrom-Aim-Pro-APK
        path: "**/build/outputs/apk/debug/*.apk"
        
