 name: Build Carrom Aim APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Project Files
      run: |
        unzip -q aim-master-pro.zip -d extracted || true
        PROJECT_DIR=$(find extracted -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
        if [ -n "$PROJECT_DIR" ]; then
          cp -r "$PROJECT_DIR"/* .
        fi
        chmod +x gradlew || true

    - name: Accept Android Licenses & Build APK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Carrom-Aim-Pro-APK
        path: "**/build/outputs/apk/**/*.apk"
        
