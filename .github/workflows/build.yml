name: Build Carrom Aim APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Extract Project Files
      run: |
        unzip -q aim-master-pro.zip -d extracted || true
        # Find directory containing settings.gradle or build.gradle
        PROJECT_DIR=$(find extracted -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
        if [ -n "$PROJECT_DIR" ]; then
          echo "Found project directory at $PROJECT_DIR"
          cp -r "$PROJECT_DIR"/* .
        fi
        chmod +x gradlew || true

    - name: Build APK with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Carrom-Aim-Pro-APK
        path: "**/build/outputs/apk/debug/*.apk"
        
