name: Build Carrom Aim APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Project and Inject Rakib Custom UI
        run: |
          unzip -q aim-master-pro.zip -d extracted || true
          mkdir -p extracted/app/src/main/res/drawable || true
          
          # Inject Photos
          cp image.jpg extracted/app/src/main/res/drawable/my_photo_1.jpg || true
          cp image-1.jpg extracted/app/src/main/res/drawable/my_photo_2.jpg || true

          # Find exact layout directory and override activity_main.xml safely
          LAYOUT_DIR=$(find extracted -type d -name "layout" | head -n 1)
          if [ -n "$LAYOUT_DIR" ]; then
            cat << 'EOF' > "$LAYOUT_DIR/activity_main.xml"
<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:background="#0A0E17"
    android:orientation="vertical"
    android:padding="20dp"
    android:gravity="center_horizontal">

    <!-- Photo Banner Image -->
    <ImageView
        android:id="@+id/bannerImage"
        android:layout_width="match_parent"
        android:layout_height="220dp"
        android:scaleType="centerCrop"
        android:src="@drawable/my_photo_2"
        android:layout_marginTop="16dp"
        android:layout_marginBottom="16dp" />

    <!-- Branding Title -->
    <TextView
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:text="Rakib AI Engine"
        android:textColor="#00E5FF"
        android:textSize="24sp"
        android:textStyle="bold"
        android:layout_marginBottom="24dp"/>

    <!-- Key Input Field -->
    <EditText
        android:id="@+id/etKeyInput"
        android:layout_width="match_parent"
        android:layout_height="52dp"
        android:background="#151E2E"
        android:hint="Enter 7-Day or Lifetime Key"
        android:textColor="#FFFFFF"
        android:textColorHint="#5B6F88"
        android:paddingHorizontal="16dp"
        android:textSize="14sp"
        android:layout_marginBottom="20dp"/>

    <!-- Launch Button -->
    <Button
        android:id="@+id/btnStartEngine"
        android:layout_width="match_parent"
        android:layout_height="56dp"
        android:text="LAUNCH CARROM POOL"
        android:textColor="#FFFFFF"
        android:textStyle="bold"
        android:backgroundTint="#00C853"/>

</LinearLayout>
EOF
          fi

          # Keystore setup
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp debug.keystore extracted/ || true
          cp debug.keystore extracted/app/ || true
          mkdir -p ~/.android || true
          cp debug.keystore ~/.android/ || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          DIR=$(find extracted -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$DIR" ]; then DIR="extracted"; fi
          cd "$DIR"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Carrom-Aim-Pro-APK
          path: "**/*.apk"
          
