name: Build Carrom Aim APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Extract Project Files
      run: |
        unzip -q aim-master-pro.zip -d extracted || true
        PROJECT_DIR=$(find extracted -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
        if [ -n "$PROJECT_DIR" ]; then
          echo "Moving files from $PROJECT_DIR"
          cp -r "$PROJECT_DIR"/* .
        fi
        chmod +x gradlew || true
        yes | sdkmanager --licenses || true

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --no-daemon
        else
          gradle assembleDebug --no-daemon
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Carrom-Aim-Pro-APK
        path: "**/build/outputs/apk/**/*.apk"
        
