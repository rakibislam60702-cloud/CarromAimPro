name: Build Carrom Aim APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Project and Inject Photos
        run: |
          unzip -q aim-master-pro.zip -d extracted || true
          mkdir -p extracted/app/src/main/res/drawable || true
          cp image.jpg extracted/app/src/main/res/drawable/my_photo_1.jpg || true
          cp image-1.jpg extracted/app/src/main/res/drawable/my_photo_2.jpg || true
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp debug.keystore extracted/ || true
          cp debug.keystore extracted/app/ || true
          mkdir -p ~/.android || true
          cp debug.keystore ~/.android/ || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          DIR=$(find extracted -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$DIR" ]; then DIR="extracted"; fi
          cd "$DIR"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Carrom-Aim-Pro-APK
          path: "**/*.apk"
          
