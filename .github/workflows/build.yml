name: Build Carrom Aim APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Replace UI with Rakib Engine Dashboard
        run: |
          unzip -q aim-master-pro.zip -d extracted || true
          
          # Inject Photos
          mkdir -p extracted/app/src/main/res/drawable || true
          cp image.jpg extracted/app/src/main/res/drawable/my_photo_1.jpg || true
          cp image-1.jpg extracted/app/src/main/res/drawable/my_photo_2.jpg || true

          # Find Main Screen Compose files and clean UI
          MAIN_SCREEN=$(find extracted -name "*Screen*.kt" -o -name "MainActivity.kt" | grep -v "theme" | head -n 1)
          
          # Force clean launcher UI activity
          find extracted -name "MainActivity.kt" | while read file; do
            cat << 'EOF' > "$file"
package com.aistudio.aimmaster.pkzywr

import android.content.Intent
import android.net.Uri
import android.os.Bundle
import android.provider.Settings
import android.widget.Toast
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.foundation.Image
import androidx.compose.foundation.background
import androidx.compose.foundation.layout.*
import androidx.compose.foundation.shape.RoundedCornerShape
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.draw.clip
import androidx.compose.ui.graphics.Color
import androidx.compose.ui.layout.ContentScale
import androidx.compose.ui.res.painterResource
import androidx.compose.ui.text.font.FontWeight
import androidx.compose.ui.unit.dp
import androidx.compose.ui.unit.sp

class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent {
            var keyText by remember { mutableStateOf("") }
            
            Column(
                modifier = Modifier
                    .fillMaxSize()
                    .background(Color(0xFF090D16))
                    .padding(24.dp),
                horizontalAlignment = Alignment.CenterHorizontally
            ) {
                Spacer(modifier = Modifier.height(20.dp))
                
                // Photo Banner
                Card(
                    shape = RoundedCornerShape(16.dp),
                    modifier = Modifier
                        .fillMaxWidth()
                        .height(220.dp)
                ) {
                    val photoRes = resources.getIdentifier("my_photo_2", "drawable", packageName).let {
                        if (it != 0) it else resources.getIdentifier("my_photo_1", "drawable", packageName)
                    }
                    if (photoRes != 0) {
                        Image(
                            painter = painterResource(id = photoRes),
                            contentDescription = "Rakib Banner",
                            contentScale = ContentScale.Crop,
                            modifier = Modifier.fillMaxSize()
                        )
                    }
                }

                Spacer(modifier = Modifier.height(16.dp))

                Text(
                    text = "Rakib AI Engine",
                    color = Color(0xFF00E5FF),
                    fontSize = 24.sp,
                    fontWeight = FontWeight.Bold
                )

                Text(
                    text = "Carrom Trajectory & Aim Assist",
                    color = Color(0xFF8B9BB4),
                    fontSize = 13.sp,
                    modifier = Modifier.padding(top = 4.dp, bottom = 32.dp)
                )

                // Key Input
                OutlinedTextField(
                    value = keyText,
                    onValueChange = { keyText = it },
                    label = { Text("Enter 7-Day or Lifetime Key", color = Color(0xFF5B6F88)) },
                    modifier = Modifier.fillMaxWidth(),
                    shape = RoundedCornerShape(12.dp),
                    colors = OutlinedTextFieldDefaults.colors(
                        focusedTextColor = Color.White,
                        unfocusedTextColor = Color.White,
                        focusedBorderColor = Color(0xFF00E5FF),
                        unfocusedBorderColor = Color(0xFF1E293B),
                        focusedContainerColor = Color(0xFF131B2A),
                        unfocusedContainerColor = Color(0xFF131B2A)
                    )
                )

                Spacer(modifier = Modifier.height(20.dp))

                // Launch Button
                Button(
                    onClick = {
                        if (!Settings.canDrawOverlays(this@MainActivity)) {
                            val intent = Intent(
                                Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                Uri.parse("package:$packageName")
                            )
                            startActivity(intent)
                            Toast.makeText(this@MainActivity, "Grant Overlay Permission", Toast.LENGTH_SHORT).show()
                        } else {
                            val launchIntent = packageManager.getLaunchIntentForPackage("com.miniclip.carrom")
                            if (launchIntent != null) {
                                startActivity(launchIntent)
                            } else {
                                Toast.makeText(this@MainActivity, "Carrom Disc Pool not installed!", Toast.LENGTH_LONG).show()
                            }
                        }
                    },
                    modifier = Modifier
                        .fillMaxWidth()
                        .height(54.dp),
                    shape = RoundedCornerShape(12.dp),
                    colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00C853))
                ) {
                    Text(
                        text = "LAUNCH CARROM POOL",
                        color = Color.White,
                        fontSize = 16.sp,
                        fontWeight = FontWeight.Bold
                    )
                }
            }
        }
    }
}
EOF
          done

          # Keystore setup
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp debug.keystore extracted/ || true
          cp debug.keystore extracted/app/ || true
          mkdir -p ~/.android || true
          cp debug.keystore ~/.android/ || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          DIR=$(find extracted -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$DIR" ]; then DIR="extracted"; fi
          cd "$DIR"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Carrom-Aim-Pro-APK
          path: "**/*.apk"
          
