name: Build Carrom Aim APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Inject Rakib Photos and Clean UI
        run: |
          unzip -q aim-master-pro.zip -d extracted || true
          
          # Inject Photos directly to all drawable folders
          find extracted -type d -name "drawable*" | while read dir; do
            cp image.jpg "$dir/my_photo_1.jpg" || true
            cp image-1.jpg "$dir/my_photo_2.jpg" || true
            cp image.jpg "$dir/banner.jpg" || true
            cp image-1.jpg "$dir/banner.png" || true
          done

          # Safe Replacement of Title and Texts with Python
          python3 -c "
          import os

          def replace_in_files(directory):
              for root, _, files in os.walk(directory):
                  for file in files:
                      if file.endswith(('.kt', '.java', '.xml')):
                          path = os.path.join(root, file)
                          try:
                              with open(path, 'r', encoding='utf-8') as f:
                                  content = f.read()
                              
                              # Replace original titles with Rakib AI Engine
                              new_content = content.replace('Aim Master', 'Rakib AI Engine')
                              new_content = new_content.replace('AIM MASTER CLOUD', 'RAKIB AI ENGINE')
                              new_content = new_content.replace('Aim Master Pro', 'Rakib AI Engine')
                              new_content = new_content.replace('AIM MASTER', 'RAKIB AI ENGINE')
                              
                              if new_content != content:
                                  with open(path, 'w', encoding='utf-8') as f:
                                      f.write(new_content)
                          except Exception:
                              pass

          replace_in_files('extracted')
          "

          # Keystore setup
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp debug.keystore extracted/ || true
          cp debug.keystore extracted/app/ || true
          mkdir -p ~/.android || true
          cp debug.keystore ~/.android/ || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          DIR=$(find extracted -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$DIR" ]; then DIR="extracted"; fi
          cd "$DIR"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Carrom-Aim-Pro-APK
          path: "**/*.apk"
          
